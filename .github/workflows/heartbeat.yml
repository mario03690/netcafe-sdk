# 外部心跳:每天检查 ainetcafe.com 的定时任务是不是还在跑。
#
# 为什么必须放在外面:2026-08-07 查出全站定时任务已经静默死了 4 天。发现不了的原因很简单——
# 我们所有的自检脚本(增长循环、模型体检、golden-probe)本身就是靠同一个调度器跑的,
# 调度器一死,它们全都不跑了,于是"负责报警的东西"和"出问题的东西"是同一批。
#
# 这个 job 跑在 GitHub 的机器上,和我们的服务器无关,所以它不会跟着一起死。
name: heartbeat

on:
  schedule:
    # 可用性探测每 15 分钟(2026-08-09 教训:整机负载打满导致对外 530 约 20 分钟,
    # 而当时心跳一天只查一次 04:00 UTC,窗口 01:42-02:05 UTC 完全错过——
    # 爬虫和 agent 调用那段时间全部打空,而我们事后才知道)。仓库 public,Actions 免费。
    - cron: '*/15 * * * *'
    # 完整巡检(定时任务新鲜度 + 全部对外入口 + 长图回归)仍每天一次,避免噪音
    - cron: '0 4 * * *'
  workflow_dispatch: {}

jobs:
  # 轻量可用性:每次都跑。连续失败才算故障——单次抖动不刷邮件。
  uptime:
    runs-on: ubuntu-latest
    steps:
      - name: Reachability (3 tries)
        run: |
          ok=0
          for i in 1 2 3; do
            c=$(curl -s -o /tmp/r.txt -w '%{http_code}' -m 20 https://ainetcafe.com/healthz || echo 000)
            echo "  try$i -> $c"
            if [ "$c" = "200" ] && grep -q '"ok":true' /tmp/r.txt; then ok=1; break; fi
            [ $i -lt 3 ] && sleep 20
          done
          if [ "$ok" != "1" ]; then
            echo "::error::ainetcafe.com 连续 3 次不可达(间隔 20s)。多为整机负载打满或隧道断。"
            exit 1
          fi
          echo "对外可达"

  check:
    # 完整巡检只在每日那一班跑,15 分钟班次跳过
    if: github.event.schedule != '*/15 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Scheduler heartbeat
        run: |
          echo "== 定时任务新鲜度 =="
          code=$(curl -s -o /tmp/h.json -w '%{http_code}' -m 30 \
            https://ainetcafe.com/api/health/scheduler || echo 000)
          cat /tmp/h.json | python3 -m json.tool || true
          if [ "$code" != "200" ]; then
            echo "::error::定时任务有停摆($code)。看上面 stale_jobs。"
            exit 1
          fi
          echo "全部任务新鲜"

      - name: Core surfaces reachable
        run: |
          fail=0
          for u in /llms.txt /mcp.html /costs /api/model-costs \
                   /t/list_models "/i/mermaid/Z3JhcGggVEQ7IEEtLT5C" \
                   /.well-known/mcp.json /agent-capabilities.json; do
            c=$(curl -s -o /dev/null -w '%{http_code}' -m 30 "https://ainetcafe.com$u" || echo 000)
            printf '  %-40s %s\n' "$u" "$c"
            [ "$c" = "200" ] || fail=1
          done
          # 长图表回归:maxParamLength 默认 100 时,所有真实尺寸的图都 404,
          # 而自测用的示例图太短一直没暴露。这里钉一个 1000+ 字符的编码源。
          long=$(printf 'graph TD\n' > /tmp/d.txt; for i in $(seq 0 19); do \
            printf '  N%s["node %s with a longer label"] --> N%s\n' "$i" "$i" "$((i+1))" >> /tmp/d.txt; done; \
            base64 -w0 /tmp/d.txt | tr '+/' '-_' | tr -d '=')
          echo "  编码长度 ${#long}"
          c=$(curl -s -o /dev/null -w '%{http_code}' -m 30 "https://ainetcafe.com/i/mermaid/$long" || echo 000)
          printf '  %-40s %s\n' "long diagram (1000+ chars)" "$c"
          [ "$c" = "200" ] || fail=1
          [ "$fail" = "0" ] || { echo "::error::有对外入口不可用"; exit 1; }
